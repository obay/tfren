version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/tfrn
    binary: tfrn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/obay/tfrn/internal/cli.Version={{.Version}}

archives:
  - format: tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: tfrn
    goarm: 6

    repository:
      owner: obay
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
      branch: main

    url_template: "http://github.com/obay/tfrn/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: Ahmad Obay
      email: obay@xtools.com

    homepage: "https://github.com/obay/tfrn"

    description: "Terraform file organizer - splits and renames files according to OTN naming convention."

    skip_upload: false

    dependencies:
      - name: go
        type: build

    test: |
      assert shell_output("#{bin}/tfrn version")

    install: |
      bin.install "tfrn"

scoops:
  - name: tfrn
    url_template: "http://github.com/obay/tfrn/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: Ahmad Obay
      email: obay@xtools.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/obay/tfrn"
    description: "Terraform file organizer - splits and renames files according to OTN naming convention."
    license: MIT
    repository:
      owner: obay
      name: scoop-bucket
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
