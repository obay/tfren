version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/tfren
    binary: tfren
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/obay/tfren/internal/cli.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: tfren
    goarm: "6"
    directory: Formula

    repository:
      owner: obay
      name: homebrew-tap
      token: "{{ .Env.GH_TOKEN }}"
      branch: main

    url_template: "https://github.com/obay/tfren/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: Ahmad Obay
      email: obay@xtools.com

    homepage: "https://github.com/obay/tfren"

    description: "Terraform file organizer - splits and renames files according to OTN naming convention."

    skip_upload: false

    install: |
      bin.install "tfren"

    test: |
      assert_match version.to_s, shell_output("#{bin}/tfren version")

scoops:
  - name: tfren
    url_template: "https://github.com/obay/tfren/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: Ahmad Obay
      email: obay@xtools.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/obay/tfren"
    description: "Terraform file organizer - splits and renames files according to OTN naming convention."
    license: MIT
    repository:
      owner: obay
      name: scoop-bucket
      branch: main
      token: "{{ .Env.GH_TOKEN }}"
